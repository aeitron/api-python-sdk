[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeitron"
version = "0.1.0"
description = "Official Python SDK for Aeitron Global Infrastructure & Multi-Objective AI Orchestration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aeitron Engineering", email = "platform@aeitron.com" }
]
keywords = ["aeitron", "edge", "ai", "inference", "anycast", "infrastructure", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.urls]
Homepage = "https://aeitron.com"
Documentation = "https://docs.aeitron.com"
Repository = "https://github.com/aeitron/api-python-sdk"
